name: Deploy Node.js App to cPanel

on:
  push:
    branches:
      - live  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout code
        uses: actions/checkout@v3

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🏗️ Build (if needed)
        run: npm run build || echo "No build script"

      - name: 🚀 Deploy to cPanel via SSH and Pull
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "📂 Navigating to app directory..."
            cd /home/wkkgb451/repositories/Asgaria
            
            echo "🚀 Pull from Git"
            git pull origin live

      - name: 🔁 Restart Node.js App via Passenger
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "🔧 Activating virtual environment..."
            source /home/wkkgb451/nodevenv/repositories/Asgaria/18/bin/activate

            echo "📂 Navigating to app directory..."
            cd /home/wkkgb451/repositories/Asgaria
            
            echo "📦 Updating dependencies..."
            npm update

            echo "✅ Node version: $(node --version)"
            echo "✅ NPM version: $(npm --version)"

            echo "♻️ Restarting Node.js app via Passenger..."
            mkdir -p tmp && touch tmp/restart.txt

            echo "✅ Application deployed and restarted successfully!"

      - name: Vérifier que la nouvelle API répond en production
        run: |
          for attempt in {1..12}; do
            status=$(curl --silent --show-error --max-time 10 --output api-response.txt --write-out '%{http_code}' \
              --header 'Cache-Control: no-cache' \
              "https://www.asgaria.org/api/admin/update_policy?deploy_check=${{ github.sha }}") || status=000
            if [ "$status" = 403 ] && grep -q '"error"' api-response.txt; then
              echo "L'API des mises à jour répond sur le serveur déployé."
              exit 0
            fi
            echo "Tentative $attempt/12 : réponse HTTP $status, attente du redémarrage."
            sleep 5
          done
          echo "Le site ne sert pas la nouvelle API après le déploiement."
          exit 1

      - name: ✅ Deployment Success
        run: echo "Déploiement vers www.asgaria.org vérifié."
