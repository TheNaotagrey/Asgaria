<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Organigramme féodal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <script src="renderHeader.js"></script>
  <main class="organigramme-main">
    <section class="organigramme-stage">
      <div id="organigramCanvas" class="organigramme-canvas">
        <div id="organigramSearchOverlay" class="organigramme-search-overlay"></div>
        <svg id="organigramSvg" class="organigramme-svg" role="img" aria-label="Organigramme féodal">
          <g id="organigramGraph"></g>
        </svg>
        <aside class="organigramme-legend legend">
          <h2>Légende des titres</h2>
          <ul id="organigramLegend" class="organigramme-legend-list"></ul>
        </aside>
      </div>
    </section>
    <aside id="seigneurInfoPanel" class="info-panel organigramme-info-panel" style="display: none;">
      <div class="info-header">
        <h2 id="seigneurInfoTitle">Seigneur</h2>
      </div>
      <div class="info-row" id="seigneurInfoReligion"></div>
      <div class="info-row seigneur-line" id="seigneurInfoOverlord"></div>
      <section class="info-group" id="seigneurTitlesSection">
        <h3>Titres</h3>
        <ul id="seigneurInfoTitles"></ul>
      </section>
      <section class="info-group" id="seigneurVassalsSection">
        <h3>Vassaux</h3>
        <div id="seigneurInfoVassals" class="organigramme-seigneur-buttons"></div>
      </section>
    </aside>
  </main>

  <script src="src/seigneurSearch.js"></script>
  <script>
    renderHeader('Organigramme féodal', () => {
      const controlsRow = document.getElementById('controls');
      if (!controlsRow) return;

      const label = document.createElement('label');
      label.setAttribute('for', 'organigramSelect');
      label.textContent = 'Organigramme :';

      const select = document.createElement('select');
      select.id = 'organigramSelect';
      select.className = 'control-btn';

      const resetBtn = document.createElement('button');
      resetBtn.id = 'resetViewBtn';
      resetBtn.className = 'control-btn';
      resetBtn.type = 'button';
      resetBtn.textContent = 'Recentrer la vue';

      const authArea = document.getElementById('authArea');
      if (authArea) {
        controlsRow.insertBefore(resetBtn, authArea);
        controlsRow.insertBefore(select, resetBtn);
        controlsRow.insertBefore(label, select);
      } else {
        controlsRow.append(label, select, resetBtn);
      }

      const { wrapper: searchWrapper } = window.SeigneurSearch.createSearchElements({
        inputId: 'seigneurSearchInput',
        resultsId: 'seigneurSearchResults',
        placeholder: 'Rechercher',
        ariaLabel: 'Rechercher',
        resultsAriaLabel: 'Résultats de recherche des seigneurs et titres'
      });

      const attachSearch = () => {
        const searchSlot = document.getElementById('organigramSearchOverlay');
        if (searchSlot && !searchSlot.contains(searchWrapper)) {
          searchSlot.appendChild(searchWrapper);
          return true;
        }
        return false;
      };

      if (!attachSearch()) {
        window.addEventListener('DOMContentLoaded', () => {
          attachSearch();
        }, { once: true });
      }
    });
  </script>
  <script src="organigramme.js"></script>
  <script src="auth.js"></script>
</body>
</html>
