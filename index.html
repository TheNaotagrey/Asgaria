<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Carte des baronnies</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <script src="renderHeader.js"></script>
  <script>
    renderHeader('Carte des baronnies', () => {
      const header = document.querySelector('.app-header');
      header.insertAdjacentHTML('beforeend', `
        <nav class="tabs">
          <a href="index.html">Baronnies</a>
          <a href="index.html?mode=sea">Carte Maritime</a>
        </nav>
      `);
      const controls = document.getElementById('controls');
      controls.insertAdjacentHTML('afterbegin', `
        <button id="randomBtn" class="control-btn">Couleurs aléatoires</button>
        <label for="filterSelect">Filtre :</label>
        <select id="filterSelect" class="control-btn"></select>
      `);
    }).then(() => {
      const script = document.createElement('script');
      script.src = 'viewer.js';
      document.body.appendChild(script);
    });
  </script>
  <main>
    <div id="mapContainer" class="map-container">
      <div id="panZoomGroup" class="panzoom-group">
        <img id="baseMap" src="Asgaria.png" alt="Carte d’Asgaria" class="base-map">
        <canvas id="pixelCanvas" class="pixel-canvas"></canvas>
      </div>
    </div>
    <aside id="infoPanel" class="info-panel" style="display:none;">
      <h2 id="baronyTitle"></h2>
      <div class="info-row" id="infoOwnerLine"></div>
      <div class="info-row" id="infoReligionLine"></div>
      <div class="info-row" id="infoCultureLine"></div>
      <section class="info-group" id="feudalSection">
        <h3>Hiérarchie féodale</h3>
        <ul id="infoFeudalList"></ul>
      </section>
      <section class="info-group" id="religiousBuildingsSection">
        <h3>Bâtiments religieux</h3>
        <ul id="infoReligiousList"></ul>
      </section>
    </aside>
    <aside id="seaInfoPanel" class="info-panel" style="display:none;">
      <h2>Zone maritime sélectionnée</h2>
      <div><strong>ID :</strong> <span id="seaInfoId"></span></div>
      <div><strong>Nom :</strong> <span id="seaInfoName"></span></div>
    </aside>
    <div id="legend" class="legend" style="display:none;"></div>
  </main>
  <script src="pixelData.js"></script>
  <script src="src/mapCore.js"></script>
  <script src="src/bfs.js"></script>
  <script src="src/mapFilters.js"></script>
    <dialog id="authDialog">
    <form id="loginForm" method="dialog">
      <h3>Connexion</h3>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Mot de passe" required>
      <button type="submit" class="control-btn">Connexion</button>
      <p><a href="#" id="showRegister">Créer un compte</a></p>
    </form>
    <form id="registerForm" method="dialog" style="display:none;flex-direction:column;">
      <h3>Créer un compte</h3>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Mot de passe" required>
      <input type="text" name="first_name" placeholder="Prénom réel" required>
      <input type="text" name="last_name" placeholder="Nom de famille réel" required>
      <small>Utilisez vos vrais prénom et nom (pas de personnage).</small>
      <button type="submit" class="control-btn">Créer</button>
      <p><a href="#" id="showLogin">Déjà un compte ?</a></p>
    </form>
    </dialog>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/timeago.js/4.0.2/timeago.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/timeago.js/4.0.2/locale/fr.min.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
