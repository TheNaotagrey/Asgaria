<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Profil</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <script src="renderHeader.js"></script>
  <script>
    renderHeader('Profil');
  </script>
  <main class="profile-main">
    <form id="profileForm" class="profile-form">
      <div class="tabs">
        <button type="button" class="tab-btn active" data-tab="info">Informations</button>
        <button type="button" class="tab-btn" data-tab="password">Mot de passe</button>
      </div>
      <div id="tab-info" class="tab-content active">
        <label for="email">Courriel</label>
        <input type="email" id="email" name="email" disabled>
        <label for="first_name">Prénom</label>
        <input type="text" id="first_name" name="first_name" required>
        <label for="last_name">Nom</label>
        <input type="text" id="last_name" name="last_name" required>
        <div id="characterField" style="display:none; flex-direction: column; gap:8px;">
          <label for="character_name">Personnage</label>
          <input type="text" id="character_name" name="character_name" disabled>
        </div>
      </div>
      <div id="tab-password" class="tab-content">
        <label for="current_password">Mot de passe actuel</label>
        <input type="password" id="current_password" name="current_password">
        <label for="new_password">Nouveau mot de passe</label>
        <input type="password" id="new_password" name="password">
        <label for="confirm_password">Confirmer le mot de passe</label>
        <input type="password" id="confirm_password" name="confirm_password">
      </div>
      <button type="submit" class="control-btn">Mettre à jour</button>
    </form>
    <div id="adminModeContainer" style="display:none" class="admin-mode">
      <label><input type="checkbox" id="adminMode"> Mode administrateur</label>
    </div>
    <div id="testModeContainer" style="display:none" class="admin-mode">
      <label><input type="checkbox" id="testMode"> Mode Test</label>
    </div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/timeago.js/4.0.2/timeago.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/timeago.js/4.0.2/locale/fr.min.js"></script>
  <script src="auth.js"></script>
  <script src="profile.js"></script>
</body>
</html>
