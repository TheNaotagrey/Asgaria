<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Éditeur de baronnies – Mode pixel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Éditeur de baronnies – Mode pixel</h1>
    <nav class="tabs">
      <a href="mapEditor.html">Baronnies</a>
      <a href="mapEditor.html?mode=sea">Carte Maritime</a>
    </nav>
    <div id="controls" class="controls-row">
      <button id="randomBtn" class="control-btn">Couleurs aléatoires</button>
      <label for="filterSelect">Filtre&nbsp;:</label>
      <select id="filterSelect" class="control-btn"></select>
      <span id="pixelLoading" class="loading-indicator" style="display:none;"></span>
      <button id="saveToFile" class="control-btn">Enregistrer les pixels</button>
      <button id="offsetBtn" class="control-btn">Offset</button>
      <button id="deleteBarony" class="control-btn">Supprimer</button>
      <button id="selectBarony" class="control-btn">Sélectionner</button>
      <button id="linkBarony" class="control-btn" title="Lier (Ctrl)">Lier</button>
      <button id="unlinkBarony" class="control-btn" title="Délier (Ctrl+Alt)">Délier</button>
      <span id="authArea" class="auth-area"></span>
    </div>
    <div id="tools" class="tools-row">
      <button id="brushTool" class="tool-btn" title="Pinceau">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M2 15 L14 3 L17 6 L5 18 Z" fill="currentColor"></path></svg>
      </button>
      <button id="eraserTool" class="tool-btn" title="Gomme">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M3 15 L8 10 L15 17 L10 17 Z" fill="currentColor"></path><path d="M8 10 L11 7 L17 13 L15 15 Z" fill="currentColor"></path></svg>
      </button>
      <button id="bucketTool" class="tool-btn" title="Pot de peinture">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M5 5 L15 5 L17 9 L3 9 Z" fill="currentColor"></path><path d="M7 9 L7 15 L13 15 L13 9 Z" fill="currentColor"></path></svg>
      </button>
      <button id="newBarony" class="tool-btn" title="Nouvelle baronnie">
        <svg width="20" height="20" viewBox="0 0 20 20">
          <rect x="9" y="2" width="2" height="16" fill="currentColor"></rect>
          <rect x="2" y="9" width="16" height="2" fill="currentColor"></rect>
        </svg>
      </button>
      <label for="brushSize" class="brush-size-label">Taille&nbsp;
        <input type="range" id="brushSize" min="1" max="10" value="1">
        <span id="brushSizeValue">1</span>
      </label>
    </div>
    <div id="authArea" class="auth-area"></div>
  </header>
  <main>
    <div id="mapContainer" class="map-container">
      <div id="cultureRanking" class="culture-ranking" style="display:none;">
        <div class="culture-ranking-title">Classement des Cultures</div>
        <table class="culture-ranking-table">
          <thead>
            <tr>
              <th>Culture</th>
              <th>Pointage</th>
            </tr>
          </thead>
          <tbody id="cultureRankingBody"></tbody>
        </table>
      </div>
      <div id="panZoomGroup" class="panzoom-group">
        <img id="baseMap" src="Asgaria.png" alt="Carte d’Asgaria" class="base-map">
        <canvas id="pixelCanvas" class="pixel-canvas"></canvas>
      </div>
    </div>
    <aside id="infoPanel" class="info-panel" style="display: none;">
      <h2>Baronnie sélectionnée</h2>
      <label for="editId">Numéro&nbsp;:</label>
      <input type="text" id="editId">
      <label for="editName">Nom&nbsp;:</label>
      <input type="text" id="editName">
      <label for="editSeigneur">Seigneur&nbsp;:</label>
      <select id="editSeigneur"><option value="">Aucun</option></select>
      <label for="editVacant">Vacante&nbsp;:</label>
      <input type="checkbox" id="editVacant">
      <label for="editReligionPop">Religion population&nbsp;:</label>
      <select id="editReligionPop"></select>

      <label>Sanctuaires&nbsp;:</label>
      <button id="editSanctuaries" class="control-btn">Gérer</button>

      <label for="editPrioryReligion">Prieuré&nbsp;:</label>
      <select id="editPrioryReligion"><option value="">Aucun</option></select>
      <label for="editChurchReligion">Église&nbsp;:</label>
      <select id="editChurchReligion"><option value="">Aucune</option></select>
      <label for="editCathedralReligion">Cathédrale&nbsp;:</label>
      <select id="editCathedralReligion"><option value="">Aucune</option></select>

      <label for="editCulture">Culture&nbsp;:</label>
      <select id="editCulture"><option value="">Aucune</option></select>
      <label for="editViscounty">Vicomté de jure&nbsp;:</label>
      <select id="editViscounty"><option value="">Aucune</option></select>
      <label for="editCounty">Comté de jure&nbsp;:</label>
      <select id="editCounty"><option value="">Aucun</option></select>
      <label>Terres canoniques&nbsp;:</label>
      <button id="editCanonical" class="control-btn">Gérer</button>
      <label>Connexions&nbsp;:</label>
      <button id="editConnections" class="control-btn">Gérer</button>
    </aside>
    <aside id="seaInfoPanel" class="info-panel" style="display: none;">
      <h2>Zone maritime sélectionnée</h2>
      <label for="seaEditId">Numéro&nbsp;:</label>
      <input type="text" id="seaEditId">
      <label for="seaEditName">Nom&nbsp;:</label>
      <input type="text" id="seaEditName">
      <label for="seaEditSeigneur">Seigneur maritime&nbsp;:</label>
      <select id="seaEditSeigneur"><option value="">Aucun</option></select>
      <button id="editSeaBaronies" class="control-btn">Associer baronnies</button>
      <label>Connexions maritimes&nbsp;:</label>
      <div id="seaConnectionList" class="connection-list"></div>
      <div class="connection-actions">
        <label for="seaConnectionTargetId">Zone maritime cible&nbsp;:</label>
        <input type="number" id="seaConnectionTargetId" min="1" placeholder="ID">
        <label for="seaConnectionDistance">Distance&nbsp;:</label>
        <input type="number" id="seaConnectionDistance" min="1" value="1">
        <button id="addSeaConnection" class="control-btn">Ajouter la connexion</button>
      </div>
    </aside>
    <div id="legend" class="legend" style="display:none;"></div>
  </main>
  <script>window.defaultEditMode = true;</script>
  <script src="pixelData.js"></script>
  <script src="src/mapCore.js"></script>
  <script src="src/bfs.js"></script>
    <script src="src/mapFilters.js"></script>
    <script src="script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/timeago.js/4.0.2/timeago.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/timeago.js/4.0.2/locale/fr.min.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
