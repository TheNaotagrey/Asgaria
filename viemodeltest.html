<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test ViewModel</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    header {
      padding: 16px 24px;
      background: #263238;
      color: #fff;
    }
    main {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
      padding: 16px;
    }
    section {
      background: #fff;
      border: 1px solid #d6d6d6;
      border-radius: 6px;
      padding: 14px;
    }
    h1, h2, h3 {
      margin: 0 0 12px;
    }
    label {
      display: block;
      margin: 10px 0 4px;
      font-weight: 700;
    }
    select, input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid #bbb;
      border-radius: 4px;
      background: #fff;
    }
    button {
      margin-top: 10px;
      cursor: pointer;
      background: #37474f;
      color: #fff;
      border-color: #37474f;
    }
    .entity-link {
      width: auto;
      margin: 0;
      padding: 2px 4px;
      border: 0;
      border-radius: 3px;
      background: transparent;
      color: #0b5cad;
      text-align: left;
      text-decoration: underline;
      font: inherit;
      cursor: pointer;
    }
    .entity-link:hover,
    .entity-link:focus {
      background: #e8f2ff;
      outline: 1px solid #8bbcf0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0 16px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 7px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #eceff1;
    }
    ul {
      margin: 6px 0 12px 20px;
      padding: 0;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
    }
    .summary-item {
      width: 100%;
      margin: 0;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 8px;
      background: #fafafa;
      color: #222;
      text-align: left;
      cursor: pointer;
    }
    .summary-item:hover,
    .summary-item:focus {
      border-color: #8bbcf0;
      background: #e8f2ff;
      outline: none;
    }
    .swatch {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 1px solid #888;
      vertical-align: -2px;
      margin-right: 6px;
    }
    .muted {
      color: #666;
    }
    .layout {
      display: grid;
      gap: 16px;
    }
    .error {
      color: #8a1c1c;
      font-weight: 700;
    }
    @media (max-width: 860px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Test ViewModel</h1>
  </header>
  <main>
    <section>
      <h2>Selection</h2>
      <p id="loadStatus" class="muted">Chargement du modele...</p>

      <label for="baronySelect">Baronnie</label>
      <select id="baronySelect"></select>

      <label for="seigneurSelect">Seigneur</label>
      <select id="seigneurSelect"></select>

      <label for="titleRankSelect">Type de titre</label>
      <select id="titleRankSelect">
        <option value="viscounty">Vicomte</option>
        <option value="county">Comte</option>
        <option value="marquisate">Marquisat</option>
        <option value="duchy">Duche</option>
        <option value="archduchy">Archiduche</option>
        <option value="kingdom">Royaume</option>
        <option value="empire">Empire</option>
      </select>

      <label for="titleSelect">Titre</label>
      <select id="titleSelect"></select>

      <button id="reloadBtn" type="button">Recharger</button>
    </section>

    <div class="layout">
      <section>
        <h2>Resume</h2>
        <div id="summary" class="summary-grid"></div>
      </section>

      <section>
        <h2>Details</h2>
        <div id="details" class="muted">Selectionnez une entite.</div>
      </section>

      <section>
        <h2>Diagnostics</h2>
        <div id="diagnostics" class="muted">Aucun diagnostic.</div>
      </section>
    </div>
  </main>

  <script src="viewModel.js"></script>
  <script src="viemodeltest.js"></script>
</body>
</html>
