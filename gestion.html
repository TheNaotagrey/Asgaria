<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Gestion de la seigneurie</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Gestion de la seigneurie</h1>
    <div id="controls" class="controls-row">
      <span id="authArea" class="auth-area"></span>
    </div>
  </header>
  <main class="gestion-main">
    <div class="tab-container" style="overflow:auto;flex:1">
      <div class="tab-buttons">
        <button class="tab-btn active" data-tab="sommaire">Sommaire</button>
        <button class="tab-btn" data-tab="infra">Infrastructures Civiles</button>
        <button class="tab-btn" data-tab="infraMili">Infrastructures Militaires</button>
        <button class="tab-btn" data-tab="ost">Ost</button>
        <button class="tab-btn" data-tab="magie" style="display:none">Magie</button>
        <button class="tab-btn" data-tab="commerce">Commerce</button>
        <button class="tab-btn push-right" data-tab="proprietes">Propriétés</button>
      </div>
      <div class="tab-panels">
        <div id="tab-sommaire" class="tab-panel active">
          <div id="adminSeigneurieSelect" style="display:none;margin-bottom:10px"></div>
          <div id="summary"></div>
        </div>
        <div id="tab-infra" class="tab-panel">
          <h2>Production</h2>
          <div id="productionInfra"></div>
          <h2>Infrastructures Civiles</h2>
          <div id="civilInfra"></div>
        </div>
        <div id="tab-infraMili" class="tab-panel">
          <div id="militaryInfra"></div>
        </div>
        <div id="tab-ost" class="tab-panel"></div>
        <div id="tab-commerce" class="tab-panel">
          <h2>Chemins commerciaux</h2>
          <div id="tradeInfo" style="margin-bottom:10px"></div>
          <div class="trade-controls" style="margin-bottom:10px">
            <button id="newTradeRouteBtn" class="control-btn">Nouvelle route</button>
          </div>
          <div id="tradeSection" class="trade-section">
            <div id="tradeMap" class="trade-map">
              <img id="tradeBaseMap" src="Asgaria.png" alt="Carte" />
              <canvas id="tradeCanvas"></canvas>
            </div>
            <div id="tradeRoutes" class="trade-routes"></div>
          </div>
        </div>
        <div id="tab-proprietes" class="tab-panel">
          <div id="baronyProps"></div>
        </div>
        <div id="tab-magie" class="tab-panel" style="display:none">
          <div id="spellInfo"></div>
          <div id="spellList"></div>
        </div>
      </div>
    </div>
  </main>
  <dialog id="confirmDialog" class="confirm-dialog">
    <p id="confirmMessage"></p>
    <div class="dialog-buttons">
      <button id="confirmCancel" class="control-btn">Annuler</button>
      <button id="confirmOk" class="control-btn danger">Confirmer</button>
    </div>
  </dialog>
  <dialog id="tradeDialog" class="confirm-dialog">
    <div id="tradeList"></div>
    <div style="margin-top:10px"><button id="tradeAddRow" class="control-btn">+</button></div>
    <div class="dialog-buttons">
      <button id="tradeCancel" class="control-btn">Annuler</button>
      <button id="tradeSend" class="control-btn">Envoyer</button>
    </div>
  </dialog>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/timeago.js/4.0.2/timeago.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/timeago.js/4.0.2/locale/fr.min.js"></script>
  <script src="auth.js"></script>
  <script src="src/mapCore.js"></script>
  <script src="gestion.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const buttons = document.querySelectorAll('.tab-btn');
      const panels = document.querySelectorAll('.tab-panel');

      function refreshTradeMap() {
        if (window.tradeMapCore) {
          requestAnimationFrame(() => {
            window.tradeMapCore.resetView();
            window.tradeMapCore.drawAll();
          });
        }
      }

      let savedTab = localStorage.getItem('gestionActiveTab');
      const availableTabs = Array.from(buttons).filter(btn => btn.style.display !== 'none').map(btn => btn.dataset.tab);
      if (!savedTab || !availableTabs.includes(savedTab)) {
        savedTab = 'sommaire';
      }

      buttons.forEach(btn => {
        const isActive = btn.dataset.tab === savedTab;
        btn.classList.toggle('active', isActive);
        btn.addEventListener('click', () => {
          const tab = btn.dataset.tab;
          buttons.forEach(b => b.classList.remove('active'));
          panels.forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('tab-' + tab).classList.add('active');
          localStorage.setItem('gestionActiveTab', tab);
          if (tab === 'commerce') refreshTradeMap();
        });
      });

      panels.forEach(p => {
        p.classList.toggle('active', p.id === 'tab-' + savedTab);
      });
      if (savedTab === 'commerce') refreshTradeMap();
    });
  </script>
</body>
</html>
